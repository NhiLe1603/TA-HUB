<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2E6BE6">
  <title>ATINO TA Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E6BE6'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='30' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- Cột trái (máy tính) -->
    <aside class="sidebar" aria-label="Điều hướng">
      <a class="brand" href="#/home"><span class="brand-logo">A</span><span>ATINO <b>TA Hub</b></span></a>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot">Always Be Casual</div>
    </aside>

    <div class="main-col">
      <!-- Thanh trên -->
      <header class="topbar">
        <a class="brand brand-mobile" href="#/home"><span class="brand-logo">A</span><span>TA Hub</span></a>
        <div class="topbar-title" id="topTitle"></div>
        <div class="topbar-right">
          <button class="save-pill" id="savePill" data-act="retrySave" type="button"></button>
          <button class="user-chip" id="userChip" data-act="openLogin" type="button" aria-label="Đổi người dùng"></button>
          <button class="icon-btn" data-act="openSettings" type="button" aria-label="Cài đặt">⚙</button>
        </div>
      </header>

      <div id="banner"></div>
      <main class="view" id="view" tabindex="-1"></main>
    </div>

    <!-- Thanh dưới (điện thoại) -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Điều hướng"></nav>
  </div>

  <div id="modal" class="modal-root" hidden></div>
  <div id="pop" class="pop" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/tools3.js"></script>
  <script src="js/learn-content.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/activity.js"></script>
</body>
</html>
